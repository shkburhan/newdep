<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Basic Deployment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }

        header {
            background: #333;
            color: white;
            padding: 1rem;
        }

        main {
            padding: 2rem;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background: #007BFF;
            color: white;
            border-radius: 5px;
        }

        button:hover {
            background: #0056b3;
        }

        footer {
            margin-top: 2rem;
            padding: 1rem;
            background: #222;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website 🚀</h1>
    </header>

    <main>
        <h2>Basic Deployment Page</h2>
        <p>This is a simple HTML page ready for deployment.</p>

        <button onclick="showMessage()">Click Me</button>
        <p id="message"></p>
    </main>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

    <script>
        function showMessage() {
            document.getElementById("message").innerText = "Your site is working perfectly!";
        }
    </script>

</body>
</html>
